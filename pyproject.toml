[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-ohtani-snn"
version = "0.2.0"
description = "A real-scale Drosophila body, driven by a connectome-derived circuit, learning to hit a pitched ball."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "FlyOhtani contributors" }
]
# Only what the code actually imports today. Phases add their own:
# gymnasium (Phase 5 task env), matplotlib (Phase 6 static figures).
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]
video = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[tool.setuptools]
packages = ["flyshohei", "flyohtani", "flyohtani.sense", "flyohtani.body", "flyohtani.brain", "flyohtani.world", "flyohtani.record", "flyohtani.task", "flyohtani.studies"]

[tool.setuptools.package-data]
# "assets/*" alone would miss the nested mesh directory. "assets/**/*" covers
# the vendored NeuroMechFly STLs, their Apache-2.0 LICENSE, and the
# provenance manifest in one non-editable wheel install -- all three are
# required for the license/provenance chain to survive installation
# (THIRD_PARTY_NOTICES.md).
flyohtani = ["assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# viewer/ is vendored third-party code (fly-connectome-template); lint fixes there
# would be modifications the template license requires us to disclose.
extend-exclude = ["viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
