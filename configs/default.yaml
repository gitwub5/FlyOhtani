env:
  id: FlyBatterEnv
  frame_skip: 5
  episode_seconds: 1.6
  render_mode: null
  seed: 7

reward:
  hit_success: 10.0
  timing_error: 2.0
  contact_velocity: 0.25
  energy_cost: 0.002
  miss: 3.0

scripted:
  trigger_distance: 0.5
  reset_angle: -0.65
  swing_gain: 1.0

ppo:
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64

snn:
  encoder: retina
  hidden_dim: 64
  dt: 0.002
  tau_mem: 0.02
  threshold: 1.0
